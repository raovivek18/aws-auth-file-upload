type FileMetadata @model @auth(rules: [
  { allow: owner, ownerField: "userId" },
  { allow: public, operations: [read] }
]) {
  id: ID!
  name: String!
  size: Int!
  type: String!
  key: String!
  userId: String! @index(name: "byUser", queryField: "listFileMetadataByUser", sortKeyFields: ["uploadTimestamp"])
  sharingStatus: SharingStatus
  shareExpiration: AWSDateTime
  uploadTimestamp: AWSDateTime!
}

type ActivityLog @model @auth(rules: [
  { allow: owner, ownerField: "userId" }
]) {
  id: ID!
  userId: String! @index(name: "byUser", queryField: "listLogsByUser", sortKeyFields: ["timestamp"])
  actionType: String!
  timestamp: AWSDateTime!
  fileId: String
  fileName: String
  ip: String
}

enum SharingStatus {
  PRIVATE
  PUBLIC
}

type UserAnalytics @model @auth(rules: [
  { allow: owner, ownerField: "userId" }
]) {
  id: ID! # userId (sub)
  totalFiles: Int!
  totalStorage: Int! # Total bytes used - Fixed from AWSInt
  totalShares: Int!
  storageLimit: Int! # Fixed from AWSInt
  lastActive: AWSDateTime!
}

type SharedFile @model @auth(rules: [
  { allow: owner, ownerField: "userId" }, # The sharer is the creator/owner
  { allow: owner, ownerField: "sharedWith", operations: [read] } # The recipient has read access
]) {
  id: ID!
  fileId: ID! @index(name: "byFile")
  sharedWith: String! @index(name: "byRecipient", queryField: "listSharedWithMe", sortKeyFields: ["createdAt"]) # recipient email
  userId: String! @index(name: "byUser") # Changed from ownerId
  ownerEmail: String
  fileName: String!
  fileKey: String!
  fileSize: Int
  fileType: String
  createdAt: AWSDateTime!
}
